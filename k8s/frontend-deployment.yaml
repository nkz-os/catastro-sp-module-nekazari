# =============================================================================
# Catastro Spain Frontend Deployment
# =============================================================================
# Frontend service for Catastro Spain module
# =============================================================================

---
# Deployment: Catastro Spain Frontend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catastro-spain-frontend
  namespace: nekazari
  labels:
    app: catastro-spain-frontend
    component: frontend
    module: catastro-spain
    nekazari.io/profile: addon
spec:
  # Restored alongside backend
  replicas: 1
  selector:
    matchLabels:
      app: catastro-spain-frontend
  template:
    metadata:
      labels:
        app: catastro-spain-frontend
        component: frontend
        module: catastro-spain
    spec:
      containers:
        - name: nginx
          image: ghcr.io/nkz-os/catastro-sp-module-nekazari/catastro-frontend-auto@sha256:080df2257533d2e3fcc1db164f8ee2d89d25d6bc088e03437d16dd89af614bce  # PR #4: parcelApi writes via entity-manager (MF2 remote is the live FE path)
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
# Service: Catastro Spain Frontend
apiVersion: v1
kind: Service
metadata:
  name: catastro-spain-frontend-service
  namespace: nekazari
  labels:
    app: catastro-spain-frontend
    component: frontend
    module: catastro-spain
spec:
  type: ClusterIP
  selector:
    app: catastro-spain-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
