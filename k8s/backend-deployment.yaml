# =============================================================================
# Catastro Spain Backend Deployment
# =============================================================================
# Backend API service for Catastro Spain module
# =============================================================================

---
# Deployment: Catastro Spain Backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catastro-spain-backend
  namespace: nekazari
  labels:
    app: catastro-spain-backend
    component: backend
    module: catastro-spain
    nekazari.io/profile: addon
spec:
  # Parked (replicas: 0) — module reads the retired cadastral_parcels read-model.
  # Re-enable only after migrating its parcel I/O to /ngsi-ld (uniform writes, Plan 2).
  replicas: 0
  selector:
    matchLabels:
      app: catastro-spain-backend
  template:
    metadata:
      labels:
        app: catastro-spain-backend
        component: backend
        module: catastro-spain
    spec:
      containers:
        - name: backend
          image: ghcr.io/nkz-os/nkz-module-cadastral-spain/backend@sha256:0855ba5acdb67a93d91d764c7aba471e02185189520f7cd42f855fc8ca370d6b  # feat: 3D buildings + FIWARE revival
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_NAME
              value: "Catastro Spain"
            - name: DEBUG
              value: "false"
            - name: API_PREFIX
              value: "/api/cadastral-api"
            # Keycloak Configuration
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: catastro-sp-config
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: JWT_AUDIENCE
              value: "account"
            # Service-to-service auth (optional)
            - name: MODULE_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: module-secrets
                  key: management-key
                  optional: true
            # Database connection
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            # Entity Manager URL (for NDVI job orchestration)
            - name: ENTITY_MANAGER_URL
              value: "http://entity-manager-service:5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 1

---
# Service: Catastro Spain Backend API
apiVersion: v1
kind: Service
metadata:
  name: catastro-spain-api-service
  namespace: nekazari
  labels:
    app: catastro-spain-backend
    component: backend
    module: catastro-spain
spec:
  type: ClusterIP
  selector:
    app: catastro-spain-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
